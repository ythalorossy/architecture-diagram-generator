# SPEC-02 AC5: the suite runs on push and pull request across Python 3.11-3.13
# on ubuntu and windows, plus a lint job and a version-guard job.
#
# The whole runtime is stdlib-only (SPEC-02 D6): the `test` matrix installs
# nothing. `coverage` and `ruff` are dev-only and are installed in their own
# jobs. Nothing here needs network access at test time, Node.js or mmdc.
name: CI

on:
  push:
  pull_request:

# The workflow only ever reads the repository.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every leg: a Windows-only path bug should not hide behind a
      # Linux failure, and vice versa (SPEC-02 Risk: Windows CI is intentional).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the test suite
        run: python -m unittest discover -s tests

  # AC2 asks that coverage be *reported*; it does not mandate a threshold, so
  # this job never fails the build on a coverage number. It is a visibility
  # job: the report lands in the run summary next to the checks. SPEC-15 owns
  # any future --fail-under budget.
  coverage:
    name: coverage (ubuntu, py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage (dev-only, SPEC-02 D6)
        run: python -m pip install coverage

      - name: Measure coverage of the skill scripts
        run: |
          coverage run --source=skills/c4-diagrams/scripts -m unittest discover -s tests
          coverage report -m | tee coverage.txt
          {
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff (dev-only, SPEC-02 D6)
        run: python -m pip install ruff

      # Pinned by pyproject.toml [tool.ruff], not on the command line, so a
      # local `ruff check skills tests` behaves identically. SPEC-15 widens the
      # rule set there.
      - name: Run ruff
        run: ruff check skills tests

  # AC6's CI half: on an interpreter below the 3.11 floor (D1) both CLIs must
  # exit 1 and say why, rather than crashing or silently degrading.
  #
  # NOTE: this job cannot pass until skills/c4-diagrams/scripts/cli_support.py
  # and the require_python() calls land (SPEC-02 plan Task 6). Until then it is
  # expected to fail with "expected exit 1 ... got 0".
  guard:
    name: version guard (py3.10 fails fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: analyze_repository.py must exit 1 on Python 3.10
        run: |
          set +e
          output="$(python skills/c4-diagrams/scripts/analyze_repository.py --help 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 1 ]; then
            echo "::error::analyze_repository.py --help must exit 1 on Python 3.10, got $status"
            exit 1
          fi
          case "$output" in
            *"Python 3.11+ is required"*) ;;
            *)
              echo "::error::guard message missing; got: $output"
              exit 1
              ;;
          esac

      - name: render_c4.py must exit 1 on Python 3.10
        run: |
          set +e
          output="$(python skills/c4-diagrams/scripts/render_c4.py --help 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 1 ]; then
            echo "::error::render_c4.py --help must exit 1 on Python 3.10, got $status"
            exit 1
          fi
          case "$output" in
            *"Python 3.11+ is required"*) ;;
            *)
              echo "::error::guard message missing; got: $output"
              exit 1
              ;;
          esac