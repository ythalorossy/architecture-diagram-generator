services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bookshop
      POSTGRES_USER: bookshop
      POSTGRES_PASSWORD: bookshop

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://bookshop:bookshop@db:5432/bookshop
      SEARCH_URL: https://search.catalog.example
      PAYMENTS_URL: https://payments.example/v1
    ports:
      - "8000:8000"
    depends_on:
      - db

  web:
    build: ./web
    ports:
      - "5173:5173"
    depends_on:
      - api
